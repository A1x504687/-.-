<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureTech | حلول الأمن السيبراني المتكاملة</title>
    <meta name="description" content=" SecureTech - مكتب متخصص في الأمن السيبراني، الاختبار الاختراقي، الاستشارات الأمنية، وحماية البنية التحتية">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6a;
            --secondary: #00d4ff;
            --accent: #ff3366;
            --dark: #0a0a0a;
            --darker: #050505;
            --card: #111111;
            --card-hover: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #888888;
            --border: #222222;
            --gradient-1: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            --gradient-2: linear-gradient(135deg, #ff3366 0%, #ff8800 100%);
            --shadow: 0 10px 40px rgba(0, 255, 136, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--darker);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        /* Selection */
        ::selection {
            background: var(--primary);
            color: var(--darker);
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.3;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            justify-content: center;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: var(--darker);
            box-shadow: var(--shadow);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-secondary:hover {
            background: var(--primary);
            color: var(--darker);
        }

        .btn-accent {
            background: var(--gradient-2);
            color: white;
        }
        .btn-accent:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 51, 102, 0.3);
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 0.9rem;
        }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: var(--gradient-1);
            border-radius: 2px;
        }
        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 20px auto 0;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }
        .logo i {
            font-size: 1.8rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            position: relative;
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-btn {
            position: relative;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
        }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Mobile Menu */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: var(--dark);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            padding: 20px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        .mobile-menu.active {
            transform: translateY(0);
            display: block;
        }
        .mobile-menu a {
            display: block;
            padding: 15px;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }
        .mobile-menu a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 51, 102, 0.03) 0%, transparent 50%);
            z-index: 0;
        }

        .hero-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .hero .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .hero-content h1 span {
            color: var(--primary);
            position: relative;
        }
        .hero-content h1 span::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(0, 255, 136, 0.2);
            z-index: -1;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 500px;
        }

        .hero-btns {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }
        .hero-stat {
            text-align: center;
        }
        .hero-stat .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }
        .hero-stat .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
        }
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .terminal-dot.red { background: #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #27c93f; }

        .terminal-body {
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
            color: var(--text-muted);
            flex: 1;
            overflow: hidden;
        }
        .terminal-line {
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeInUp 0.5s forwards;
        }
        .terminal-line:nth-child(1) { animation-delay: 0.5s; }
        .terminal-line:nth-child(2) { animation-delay: 1s; }
        .terminal-line:nth-child(3) { animation-delay: 1.5s; }
        .terminal-line:nth-child(4) { animation-delay: 2s; }
        .terminal-line:nth-child(5) { animation-delay: 2.5s; }
        .terminal-line:nth-child(6) { animation-delay: 3s; }

        .cmd { color: var(--primary); }
        .output { color: var(--secondary); }
        .error { color: var(--accent); }
        .success { color: #27c93f; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sections General */
        section {
            padding: 100px 0;
            position: relative;
        }
        section:nth-child(even) {
            background: var(--dark);
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-image {
            position: relative;
        }
        .about-image-main {
            width: 100%;
            height: 400px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--primary);
            position: relative;
            overflow: hidden;
        }
        .about-image-main::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent 30%);
            animation: rotate 4s linear infinite;
            opacity: 0.1;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .about-content h3 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--primary);
        }
        .about-content p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .vision-mission {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .vm-card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .vm-card i {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 15px;
        }
        .vm-card h4 {
            margin-bottom: 10px;
        }

        /* Stats Counter */
        .stats-section {
            padding: 60px 0;
            background: var(--card) !important;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }
        .stat-item {
            text-align: center;
            padding: 30px;
            background: var(--dark);
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .stat-item:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }
        .stat-item i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            display: block;
        }
        .stat-label {
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .service-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            transform: scaleX(0);
            transition: transform 0.4s;
        }
        .service-card:hover::before {
            transform: scaleX(1);
        }
        .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        .service-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 2rem;
            color: var(--primary);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .service-card h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Store Section */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s;
        }
        .product-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        .product-image {
            height: 200px;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
            position: relative;
        }
        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .product-info {
            padding: 25px;
        }
        .product-info h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .product-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }
        .product-price .old {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-right: 8px;
        }

        /* Portfolio */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .portfolio-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            height: 300px;
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .portfolio-card .portfolio-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
            transition: transform 0.5s;
        }
        .portfolio-card:hover .portfolio-img {
            transform: scale(1.1);
        }
        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            transform: translateY(100%);
            transition: transform 0.4s;
        }
        .portfolio-card:hover .portfolio-overlay {
            transform: translateY(0);
        }
        .portfolio-overlay h3 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        .portfolio-overlay p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Team */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        .team-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s;
        }
        .team-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }
        .team-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--dark);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
            border: 3px solid var(--border);
            transition: all 0.3s;
        }
        .team-card:hover .team-avatar {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        .team-card h3 {
            margin-bottom: 5px;
        }
        .team-role {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .team-social {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .team-social a {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s;
        }
        .team-social a:hover {
            background: var(--primary);
            color: var(--darker);
        }

        /* Blog */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .blog-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s;
        }
        .blog-card:hover {
            border-color: var(--secondary);
            transform: translateY(-5px);
        }
        .blog-image {
            height: 200px;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--secondary);
        }
        .blog-content {
            padding: 25px;
        }
        .blog-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .blog-content h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            line-height: 1.4;
        }
        .blog-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Testimonials */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .testimonial-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            position: relative;
            transition: all 0.4s;
        }
        .testimonial-card:hover {
            border-color: var(--secondary);
        }
        .testimonial-card::before {
            content: '"';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.2;
            line-height: 1;
        }
        .testimonial-text {
            margin-bottom: 25px;
            color: var(--text);
            line-height: 1.8;
        }
        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .testimonial-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: 700;
        }
        .testimonial-info h4 {
            margin-bottom: 3px;
        }
        .testimonial-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .stars {
            color: #ffc107;
            margin-bottom: 15px;
        }

        /* Pricing */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .pricing-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s;
            position: relative;
        }
        .pricing-card.featured {
            border-color: var(--primary);
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }
        .pricing-card.featured::before {
            content: 'الأكثر طلباً';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gradient-1);
            color: var(--darker);
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .pricing-card:hover {
            border-color: var(--primary);
        }
        .pricing-card h3 {
            margin-bottom: 10px;
        }
        .pricing-card .price {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            margin: 20px 0;
        }
        .pricing-card .price span {
            font-size: 1rem;
            color: var(--text-muted);
        }
        .pricing-features {
            list-style: none;
            margin: 30px 0;
            text-align: right;
        }
        .pricing-features li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }
        .pricing-features li i {
            color: var(--primary);
            margin-left: 10px;
        }

        /* FAQ */
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .faq-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .faq-question {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }
        .faq-question:hover {
            color: var(--primary);
        }
        .faq-question i {
            transition: transform 0.3s;
            color: var(--primary);
        }
        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }
        .faq-answer {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s;
            color: var(--text-muted);
        }
        .faq-item.active .faq-answer {
            padding: 0 25px 20px;
            max-height: 300px;
        }

        /* Contact */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }
        .contact-info h3 {
            margin-bottom: 30px;
            font-size: 1.5rem;
        }
        .contact-item {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }
        .contact-item i {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .contact-item h4 {
            margin-bottom: 5px;
        }
        .contact-item p {
            color: var(--text-muted);
        }

        .contact-form {
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Map placeholder */
        .map-container {
            width: 100%;
            height: 300px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            margin-top: 40px;
        }
        .map-container i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        /* Partners */
        .partners-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            opacity: 0.6;
        }
        .partner-item {
            font-size: 2rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }
        .partner-item:hover {
            color: var(--primary);
            opacity: 1;
        }

        /* Free Resources */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        .resource-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .resource-card:hover {
            border-color: var(--secondary);
            transform: translateX(-5px);
        }
        .resource-icon {
            width: 60px;
            height: 60px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--secondary);
            flex-shrink: 0;
        }
        .resource-info h4 {
            margin-bottom: 5px;
        }
        .resource-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            background: var(--dark);
            border-top: 1px solid var(--border);
            padding: 80px 0 30px;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 60px;
        }
        .footer-brand p {
            color: var(--text-muted);
            margin: 20px 0;
            max-width: 300px;
        }
        .footer-social {
            display: flex;
            gap: 15px;
        }
        .footer-social a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s;
        }
        .footer-social a:hover {
            background: var(--primary);
            color: var(--darker);
        }
        .footer-links h4 {
            margin-bottom: 25px;
            color: var(--primary);
        }
        .footer-links ul {
            list-style: none;
        }
        .footer-links li {
            margin-bottom: 12px;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            color: var(--primary);
        }
        .footer-bottom {
            border-top: 1px solid var(--border);
            padding-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Floating Buttons */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: #25d366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: all 0.3s;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--primary);
            color: var(--darker);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            transform: translateY(-5px);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 30px 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            font-size: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: var(--accent);
        }
        .modal-body {
            padding: 30px;
        }

        /* Page System */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* Shop Page */
        .shop-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 25px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: var(--darker);
            border-color: var(--primary);
        }

        /* Cart Page */
        .cart-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .cart-item-image {
            width: 80px;
            height: 80px;
            background: var(--dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary);
            flex-shrink: 0;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-info h4 {
            margin-bottom: 5px;
        }
        .cart-item-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .cart-item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px;
        }
        .cart-summary {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }
        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .cart-summary-row.total {
            border-top: 1px solid var(--border);
            padding-top: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .cart-empty {
            text-align: center;
            padding: 80px 20px;
        }
        .cart-empty i {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }
        .dashboard-sidebar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            height: fit-content;
        }
        .dashboard-user {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        .dashboard-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--dark);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary);
        }
        .dashboard-menu {
            list-style: none;
        }
        .dashboard-menu li {
            margin-bottom: 10px;
        }
        .dashboard-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s;
        }
        .dashboard-menu a:hover, .dashboard-menu a.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary);
        }
        .dashboard-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
        }
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .dashboard-stat {
            background: var(--dark);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .dashboard-stat h4 {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .dashboard-stat .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--card);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 3000;
            transition: all 0.4s;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .hero .container,
            .about-grid,
            .contact-grid,
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .footer-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .nav-links, .nav-actions .btn {
                display: none;
            }
            .mobile-toggle {
                display: block;
            }
            .hero-stats {
                gap: 20px;
            }
            .vision-mission {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .pricing-card.featured {
                transform: none;
            }
            .footer-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .footer-brand p {
                max-width: 100%;
            }
            .footer-social {
                justify-content: center;
            }
            .section-header h2 {
                font-size: 1.8rem;
            }
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .dashboard-sidebar {
                display: none;
            }
        }

        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--darker);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s;
        }
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 20px;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
        }

        /* Section specific for inner pages */
        .page-header {
            padding: 150px 0 80px;
            text-align: center;
            background: var(--dark);
            position: relative;
            overflow: hidden;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 70%);
        }
        .page-header .container {
            position: relative;
        }
        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Product Detail */
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }
        .product-gallery {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            font-size: 6rem;
            color: var(--primary);
        }
        .product-info-detail h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .product-info-detail .price {
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 20px;
        }
        .product-info-detail p {
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .product-features {
            list-style: none;
            margin-bottom: 30px;
        }
        .product-features li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .product-features li i {
            color: var(--primary);
            margin-left: 10px;
        }

        /* Blog Detail */
